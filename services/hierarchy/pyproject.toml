[project]
name = "hierarchy-service"
version = "0.1.0"
description = "The container tree: spaces, folders, lists, and their status sets."
requires-python = ">=3.12"
dependencies = [
  "common",
  "uvicorn[standard]>=0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",   # migrations only: runs the multi-statement baseline SQL
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hierarchy_service"]
