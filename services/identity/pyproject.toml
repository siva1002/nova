[project]
name = "identity-service"
version = "0.1.0"
description = "Who you are: accounts, passwords, sessions, tokens and the public signing keys. Global (not per workspace)."
requires-python = ">=3.12"
dependencies = [
  "common",
  "uvicorn[standard]>=0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",   # migrations only: runs the multi-statement baseline SQL
  "argon2-cffi>=23.1",
  "email-validator>=2.1",   # pydantic EmailStr on sign-up
  "python-dotenv>=1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
