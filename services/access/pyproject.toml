[project]
name = "access-service"
version = "0.1.0"
description = "Workspaces, members, invites, roles and the permission check every other service calls."
requires-python = ">=3.12"
dependencies = [
  "common",
  "uvicorn[standard]>=0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",   # migrations only: runs the multi-statement baseline SQL
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_service"]
