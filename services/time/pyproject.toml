[project]
name = "time-service"
version = "0.1.0"
description = "Time tracking. MVP: manual entries, totals per task, 'my time'. Timer and timesheets come in sprints 36-37."
requires-python = ">=3.12"
dependencies = [
  "common",
  "uvicorn[standard]>=0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",   # migrations only: runs the multi-statement baseline SQL
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_service"]
