[project]
name = "common"
version = "0.1.0"
description = "Thin shared plumbing for every service. NO business logic, NO domain models. See libs/common/README.md."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "uuid-utils>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
